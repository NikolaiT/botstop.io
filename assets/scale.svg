<svg xmlns="http://www.w3.org/2000/svg" width="820" height="30" viewBox="0 0 820 30" role="img" aria-labelledby="sc-title">
  <title id="sc-title">A suspicion score of 0 to 17 is human, 18 to 44 is suspicious, and 45 to 100 or one strong signal is automated.</title>
  <clipPath id="c"><rect width="820" height="30" rx="6"/></clipPath>
  <g clip-path="url(#c)">
    <rect width="146.6" height="30" fill="#3dd68c"/>
    <rect x="148.6" width="219.4" height="30" fill="#e5a91b"/>
    <rect x="370" width="450" height="30" fill="#ef4444"/>
  </g>
  <g font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#0b0b0c" text-anchor="middle">
    <text x="73.3" y="19">HUMAN 0&#8211;17</text>
    <text x="258.3" y="19">SUSPICIOUS 18&#8211;44</text>
    <text x="595" y="19">AUTOMATED 45&#8211;100, or one strong signal</text>
  </g>
</svg>
